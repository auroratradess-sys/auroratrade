<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Aurora Trades</title>
<meta name="theme-color" content="#101B2D"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<link rel="manifest" href="manifest.json"/>
<link rel="icon" href="icon-192.png"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{navy:{DEFAULT:'#101B2D',deep:'#17263B'},ivory:'#F7F5EF',emerald:{DEFAULT:'#16866A',light:'#e8f5f1'},gold:{DEFAULT:'#C6A66B',soft:'#f5efe4'},soft:'#8A96A5',line:'#E6E9ED',danger:'#C94C4C'},fontFamily:{sans:['Manrope','system-ui','sans-serif']}}}}</script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:Manrope,system-ui,sans-serif;background:#F7F5EF;margin:0;color:#101B2D}
.card{background:#fff;border:1px solid #E6E9ED;border-radius:16px}
.btn{background:#101B2D;color:#fff;border:none}.btn:disabled{opacity:.45}
.btn-emerald{background:#16866A;color:#fff}.btn-outline{background:#fff;border:1.5px solid #E6E9ED;color:#101B2D}
.nav-item.active{color:#101B2D}.status-success{color:#16866A;background:#e8f5f1}.status-pending{color:#b45309;background:#fef3c7}.status-rejected{color:#C94C4C;background:#fef2f2}
.fade{animation:fade .25s ease}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
input:focus,select:focus{outline:none;box-shadow:0 0 0 3px rgba(16,27,45,.12);border-color:#101B2D}
.bottom-nav{box-shadow:0 -4px 24px rgba(16,27,45,.06)}
.loader{border:2.5px solid #E6E9ED;border-top-color:#101B2D;border-radius:50%;width:20px;height:20px;animation:spin .6s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:9999;max-width:90%}
.chart-box{background:#0b1220;border-radius:14px;overflow:hidden}
.candle{display:inline-block;width:6px;margin:0 2px;border-radius:1px;vertical-align:bottom;position:relative}
.candle.up{background:#26a69a}.candle.down{background:#ef5350}
.candle .wick{position:absolute;left:50%;width:1px;transform:translateX(-50%);background:inherit}
.demo-badge{font-size:9px;background:#C6A66B;color:#101B2D;padding:2px 6px;border-radius:4px;font-weight:700}
.notif-dot{position:absolute;top:-1px;right:-1px;width:8px;height:8px;background:#C94C4C;border-radius:50%;border:1.5px solid #fff}
.hide-bal .bal-val{filter:blur(7px);user-select:none}
</style>
</head>
<body>
<div id="toast" class="toast hidden"></div>
<div id="auth" class="min-h-screen flex items-center justify-center p-4 bg-navy">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <div class="w-12 h-12 mx-auto mb-4 rounded-xl bg-navy-deep border border-gold/30 flex items-center justify-center"><svg class="w-6 h-6 text-gold" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg></div>
      <h1 class="text-2xl font-extrabold text-white">Aurora Trades</h1>
      <p class="text-sm text-soft mt-1">Secure · Live · Multi-device</p>
    </div>
    <div id="login-card" class="card p-6">
      <h2 class="text-lg font-bold text-center mb-5 text-navy">Sign in</h2>
      <form id="login-form" class="space-y-4">
        <div><label class="block text-sm font-medium text-soft mb-1.5">Phone</label><input type="tel" id="login-phone" maxlength="11" class="w-full px-4 py-3 rounded-xl border border-line bg-ivory" inputmode="numeric"/><p id="login-phone-err" class="text-danger text-xs mt-1 hidden"></p></div>
        <div><label class="block text-sm font-medium text-soft mb-1.5">Password</label><input type="password" id="login-password" class="w-full px-4 py-3 rounded-xl border border-line bg-ivory"/><p id="login-pass-err" class="text-danger text-xs mt-1 hidden"></p></div>
        <button type="submit" id="login-btn" class="btn w-full py-3.5 rounded-xl font-semibold">Sign In</button>
      </form>
      <p class="mt-5 text-center text-sm text-soft">New? <button onclick="showRegister()" class="text-navy font-semibold">Create account</button></p>
    </div>
    <div id="register-card" class="card p-6 hidden">
      <h2 class="text-lg font-bold text-center mb-1 text-navy">Create Account</h2>
      <p class="text-center text-emerald font-medium text-sm mb-5">Welcome bonus ₦750</p>
      <form id="register-form" class="space-y-3.5">
        <div><label class="block text-sm font-medium text-soft mb-1.5">Full Name</label><input type="text" id="reg-name" class="w-full px-4 py-3 rounded-xl border border-line bg-ivory"/><p id="reg-name-err" class="text-danger text-xs mt-1 hidden"></p></div>
        <div><label class="block text-sm font-medium text-soft mb-1.5">Phone</label><input type="tel" id="reg-phone" maxlength="11" class="w-full px-4 py-3 rounded-xl border border-line bg-ivory" inputmode="numeric"/><p id="reg-phone-err" class="text-danger text-xs mt-1 hidden"></p></div>
        <div><label class="block text-sm font-medium text-soft mb-1.5">Password</label><input type="password" id="reg-password" class="w-full px-4 py-3 rounded-xl border border-line bg-ivory"/><p id="reg-pass-err" class="text-danger text-xs mt-1 hidden"></p></div>
        <div><label class="block text-sm font-medium text-soft mb-1.5">Referral (optional)</label><input type="text" id="reg-ref" class="w-full px-4 py-3 rounded-xl border border-line bg-ivory"/></div>
        <button type="submit" class="btn w-full py-3.5 rounded-xl font-semibold">Create Account</button>
      </form>
      <p class="mt-5 text-center text-sm text-soft">Have account? <button onclick="showLogin()" class="text-navy font-semibold">Sign in</button></p>
    </div>
  </div>
</div>
<div id="app" class="hidden min-h-screen pb-20">
  <header class="sticky top-0 z-20 bg-white/95 backdrop-blur border-b border-line px-4 py-3 flex items-center justify-between">
    <button onclick="go('profile')" id="top-avatar" class="w-9 h-9 rounded-full bg-navy text-white flex items-center justify-center font-bold text-sm">U</button>
    <span class="font-bold text-navy text-sm">Aurora Trades</span>
    <button onclick="toggleNotif()" class="relative w-9 h-9 rounded-full bg-ivory flex items-center justify-center"><svg class="w-5 h-5 text-navy" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg><span id="notif-dot" class="notif-dot hidden"></span></button>
  </header>
  <div id="notif-panel" class="hidden absolute top-14 left-3 right-3 z-30 card p-4 max-h-64 overflow-y-auto shadow-lg"><div class="flex justify-between mb-3"><h3 class="font-semibold text-sm">Notifications</h3><button onclick="toggleNotif()" class="text-xs text-soft">Close</button></div><div id="notif-list"></div></div>
  <div id="page-home" class="page p-4 max-w-lg mx-auto fade"></div>
  <div id="page-tasks" class="page p-4 max-w-lg mx-auto fade hidden"></div>
  <div id="page-task" class="page p-4 max-w-lg mx-auto fade hidden"></div>
  <div id="page-vip" class="page p-4 max-w-lg mx-auto fade hidden"></div>
  <div id="page-withdraw" class="page p-4 max-w-lg mx-auto fade hidden"></div>
  <div id="page-history" class="page p-4 max-w-lg mx-auto fade hidden"></div>
  <div id="page-referrals" class="page p-4 max-w-lg mx-auto fade hidden"></div>
  <div id="page-profile" class="page p-4 max-w-lg mx-auto fade hidden"></div>
  <nav class="bottom-nav fixed bottom-0 left-0 right-0 bg-white border-t border-line flex justify-around py-2 z-30">
    <button onclick="go('home')" data-p="home" class="nav-item flex flex-col items-center gap-0.5 px-2 py-1 text-soft text-[10px] font-medium"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0a1 1 0 01-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 01-1 1h-2z"/></svg>Home</button>
    <button onclick="go('tasks')" data-p="tasks" class="nav-item flex flex-col items-center gap-0.5 px-2 py-1 text-soft text-[10px] font-medium"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>Activity</button>
    <button onclick="go('vip')" data-p="vip" class="nav-item flex flex-col items-center gap-0.5 px-2 py-1 text-soft text-[10px] font-medium"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"/></svg>Plans</button>
    <button onclick="go('referrals')" data-p="referrals" class="nav-item flex flex-col items-center gap-0.5 px-2 py-1 text-soft text-[10px] font-medium"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>Referrals</button>
    <button onclick="go('profile')" data-p="profile" class="nav-item flex flex-col items-center gap-0.5 px-2 py-1 text-soft text-[10px] font-medium"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>Profile</button>
  </nav>
</div>
<script>
const API='', SESSION='aurora_live_sess', WHATSAPP='2348162314640', TASK_SEC=90, REF_REWARD=850;
const VIP=[{level:1,price:6500,daily:932,name:'VIP 1'},{level:2,price:8500,daily:1800,name:'VIP 2'},{level:3,price:12000,daily:2500,name:'VIP 3'},{level:4,price:15000,daily:3200,name:'VIP 4'}];
let currentUser=null, timer=null, left=TASK_SEC, reward=0, chartMode='candle', rewardClaimed=false;

async function api(path, opts={}){const res=await fetch(API+path,{headers:{'Content-Type':'application/json',...(opts.headers||{})},...opts});const data=await res.json().catch(()=>({}));if(!res.ok)throw new Error(data.error||'Request failed');return data;}
function money(n){return '₦'+Number(n).toLocaleString('en-NG');}
function fdate(i){return new Date(i).toLocaleString('en-NG',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});}
function vip(l){return VIP.find(v=>v.level===l);}
function toast(m,t='success'){const el=document.getElementById('toast');el.className=`toast ${t==='error'?'bg-danger':t==='info'?'bg-navy':'bg-emerald'} text-white px-5 py-3 rounded-xl shadow-lg text-sm font-medium`;el.textContent=m;el.classList.remove('hidden');setTimeout(()=>el.classList.add('hidden'),2800);}
function saveSess(u){localStorage.setItem(SESSION,JSON.stringify({userId:u.id}));currentUser=u;}
function clearSess(){localStorage.removeItem(SESSION);currentUser=null;}
function getSess(){try{return JSON.parse(localStorage.getItem(SESSION));}catch{return null;}}

function showLogin(){document.getElementById('login-card').classList.remove('hidden');document.getElementById('register-card').classList.add('hidden');}
function showRegister(){document.getElementById('login-card').classList.add('hidden');document.getElementById('register-card').classList.remove('hidden');}

document.getElementById('login-form').onsubmit=async e=>{
  e.preventDefault();
  const phone=document.getElementById('login-phone').value.trim(),pass=document.getElementById('login-password').value;
  document.getElementById('login-phone-err').classList.add('hidden');document.getElementById('login-pass-err').classList.add('hidden');
  if(!/^\d{11}$/.test(phone)){document.getElementById('login-phone-err').textContent='11-digit phone';document.getElementById('login-phone-err').classList.remove('hidden');return;}
  const btn=document.getElementById('login-btn');btn.disabled=true;btn.innerHTML='<div class="loader mx-auto"></div>';
  try{const data=await api('/api/login',{method:'POST',body:JSON.stringify({phone,password:pass})});saveSess(data.user);toast('Welcome, '+data.user.name.split(' ')[0]);enter();}
  catch(err){document.getElementById('login-pass-err').textContent=err.message;document.getElementById('login-pass-err').classList.remove('hidden');}
  btn.disabled=false;btn.textContent='Sign In';
};
document.getElementById('register-form').onsubmit=async e=>{
  e.preventDefault();
  const name=document.getElementById('reg-name').value.trim(),phone=document.getElementById('reg-phone').value.trim(),pass=document.getElementById('reg-password').value,ref=document.getElementById('reg-ref').value.trim();
  ['reg-name-err','reg-phone-err','reg-pass-err'].forEach(id=>document.getElementById(id).classList.add('hidden'));
  if(name.length<2){document.getElementById('reg-name-err').textContent='Enter name';document.getElementById('reg-name-err').classList.remove('hidden');return;}
  if(!/^\d{11}$/.test(phone)){document.getElementById('reg-phone-err').textContent='11-digit phone';document.getElementById('reg-phone-err').classList.remove('hidden');return;}
  if(pass.length<6){document.getElementById('reg-pass-err').textContent='Min 6 chars';document.getElementById('reg-pass-err').classList.remove('hidden');return;}
  try{const data=await api('/api/register',{method:'POST',body:JSON.stringify({name,phone,password:pass,referralCode:ref})});saveSess(data.user);toast('Account created. ₦750 credited.');enter();}
  catch(err){document.getElementById('reg-phone-err').textContent=err.message;document.getElementById('reg-phone-err').classList.remove('hidden');}
};

function logout(){clearSess();document.getElementById('app').classList.add('hidden');document.getElementById('auth').classList.remove('hidden');showLogin();}
function enter(){document.getElementById('auth').classList.add('hidden');document.getElementById('app').classList.remove('hidden');if(currentUser)document.getElementById('top-avatar').textContent=currentUser.name[0].toUpperCase();go('home');setInterval(()=>{if(currentUser)api('/api/touch',{method:'POST',body:JSON.stringify({userId:currentUser.id})}).catch(()=>{});},60000);}
async function refreshUser(){if(!currentUser)return;try{const d=await api('/api/user/'+currentUser.id);currentUser=d.user;saveSess(currentUser);}catch(e){}}

function go(p){if(timer&&p!=='task'){clearInterval(timer);timer=null;}document.getElementById('notif-panel').classList.add('hidden');document.querySelectorAll('.page').forEach(x=>x.classList.add('hidden'));const el=document.getElementById('page-'+p);if(el){el.classList.remove('hidden');el.classList.add('fade');}document.querySelectorAll('.nav-item').forEach(n=>{n.classList.remove('active');if(n.dataset.p===p)n.classList.add('active');});
if(p==='home')home();else if(p==='tasks')tasks();else if(p==='vip')vipPage();else if(p==='withdraw')withdraw();else if(p==='history')history();else if(p==='referrals')referrals();else if(p==='profile')profile();}

async function home(){
  await refreshUser();const u=currentUser;if(!u)return;
  let recent=[];try{const d=await api('/api/transactions/'+u.id);recent=(d.transactions||[]).slice(0,4);}catch(e){}
  const v=vip(u.vipLevel);
  document.getElementById('page-home').innerHTML=`
    <div class="mb-5"><h1 class="text-xl font-bold text-navy">Hello, ${u.name.split(' ')[0]}</h1>
    <p class="text-sm text-soft">${u.phone} ${u.vipLevel?`<span class="ml-1 px-2 py-0.5 rounded-full bg-gold-soft text-gold text-xs font-semibold">VIP ${u.vipLevel}</span>`:`<span class="ml-1 px-2 py-0.5 rounded-full bg-line text-soft text-xs">No VIP</span>`}</p></div>
    <div class="card p-5 mb-4 bg-navy text-white"><p class="text-soft text-xs">Available Balance</p><p class="text-3xl font-extrabold">${money(u.balance)}</p>
    <div class="flex gap-5 mt-4 text-sm"><div><p class="text-soft text-xs">Total</p><p class="font-semibold">${money(u.totalEarnings)}</p></div><div><p class="text-soft text-xs">Today</p><p class="font-semibold">${money(u.todayEarnings||0)}</p></div><div><p class="text-soft text-xs">Tasks</p><p class="font-semibold">${u.tasksToday||0}/1</p></div></div></div>
    ${u.vipLevel===0?`<div class="card p-5 mb-4 border border-gold bg-gold-soft"><p class="font-semibold text-navy text-sm">Membership Required</p><button onclick="go('vip')" class="btn mt-3 px-5 py-2.5 rounded-xl text-sm font-semibold">View Plans</button></div>`:
    `<div class="card p-4 mb-4 border border-emerald bg-emerald-light flex justify-between items-center"><div><p class="text-sm font-semibold text-emerald">VIP ${u.vipLevel}</p><p class="text-xs text-soft">${(u.tasksToday||0)>=1?'Done today':'1 activity · '+money(v.daily)}</p></div><button onclick="go('tasks')" class="btn-emerald px-4 py-2 rounded-xl text-sm font-semibold">Activity</button></div>`}
    <div class="grid grid-cols-2 gap-3 mb-5"><button onclick="go('${u.vipLevel?'tasks':'vip'}')" class="btn py-3.5 rounded-xl font-semibold text-sm">${u.vipLevel?'Activity':'Get VIP'}</button><button onclick="go('withdraw')" class="btn-outline py-3.5 rounded-xl font-semibold text-sm">Withdraw</button></div>
    <div class="card p-5"><div class="flex justify-between mb-3"><h2 class="font-semibold text-sm">Recent</h2><button onclick="go('history')" class="text-xs text-navy">All</button></div>
    ${recent.length===0?'<p class="text-center text-soft text-sm py-6">No activity</p>':recent.map(t=>`<div class="flex justify-between py-3 border-b border-line last:border-0"><div><p class="text-sm font-medium capitalize">${t.type.replace(/_/g,' ')}</p><p class="text-xs text-soft">${fdate(t.date)}</p></div><p class="text-sm font-semibold ${t.amount>=0?'text-emerald':''}">${t.amount>=0?'+':''}${money(t.amount)}</p></div>`).join('')}</div>`;
}

function vipPage(){
  const u=currentUser;
  document.getElementById('page-vip').innerHTML=`<div class="mb-5"><h1 class="text-xl font-bold text-navy">Membership</h1><p class="text-sm text-soft">1 activity/day = full daily reward (after admin approval)</p></div>
  ${VIP.map(v=>`<div class="card p-5 mb-3 ${u.vipLevel===v.level?'ring-2 ring-gold':''}"><div class="flex justify-between mb-2"><h3 class="font-bold">${v.name}</h3><div class="text-right"><p class="font-extrabold">${money(v.price)}</p><p class="text-xs text-emerald">${money(v.daily)}/day</p></div></div>
  ${u.vipLevel===v.level?'<div class="text-center py-2 bg-gold-soft rounded-xl text-gold text-sm font-semibold">Current</div>':`<a href="https://wa.me/${WHATSAPP}?text=${encodeURIComponent('Hello Aurora Trades, I want '+v.name+' (₦'+v.price.toLocaleString()+'). Phone: '+u.phone)}" target="_blank" class="btn w-full py-3 rounded-xl text-sm font-semibold block text-center">Pay via WhatsApp</a>`}</div>`).join('')}
  <div class="card p-4 text-center bg-ivory mt-2"><p class="text-sm">Support: <a href="https://wa.me/${WHATSAPP}" class="text-navy font-semibold">0816 231 4640</a></p></div>`;
}

async function tasks(){
  await refreshUser();const u=currentUser;
  if(u.vipLevel===0){document.getElementById('page-tasks').innerHTML=`<div class="card p-10 text-center"><h3 class="font-semibold mb-2">Locked</h3><button onclick="go('vip')" class="btn px-6 py-3 rounded-xl text-sm">View Plans</button></div>`;return;}
  const v=vip(u.vipLevel),done=(u.tasksToday||0)>=1;
  document.getElementById('page-tasks').innerHTML=`<div class="mb-5"><h1 class="text-xl font-bold text-navy">Daily Activity</h1><p class="text-sm text-soft">VIP ${u.vipLevel} · ${money(v.daily)} after approval</p></div>
  ${done?`<div class="card p-10 text-center"><h3 class="font-semibold">Done for today</h3><p class="text-soft text-sm mt-2">Reward pending admin approval if just submitted</p></div>`:
  `<div class="card p-5"><h3 class="font-semibold mb-1">Market Observation</h3><p class="text-sm text-soft mb-3">Watch demo chart 1m 30s. Admin approves reward.</p><span class="demo-badge">DEMO</span>
  <button onclick="startCheckin()" class="btn w-full py-3.5 rounded-xl font-semibold text-sm mt-4">Start Activity</button></div>`}`;
}

function startCheckin(){const u=currentUser,v=vip(u.vipLevel);if(!v||(u.tasksToday||0)>=1){toast('Already done','error');return;}reward=v.daily;left=TASK_SEC;rewardClaimed=false;chartMode='candle';document.querySelectorAll('.page').forEach(p=>p.classList.add('hidden'));document.getElementById('page-task').classList.remove('hidden');renderChart();startTimer();}
function renderChart(){
  document.getElementById('page-task').innerHTML=`<div class="mb-3 flex justify-between"><button onclick="cancelCheckin()" class="text-sm text-soft">Cancel</button><span class="text-xs text-soft">BTC <span class="demo-badge">DEMO</span></span><span id="tmr-mini" class="text-xs font-medium">1:30</span></div>
  <div class="chart-box p-3 mb-3" style="height:220px"><div class="flex justify-between mb-1 px-1"><p class="text-white font-bold" id="price">$97,420</p><p class="text-xs text-emerald" id="chg">+1.2%</p></div><div id="chart-canvas" class="h-40 flex items-end justify-center"></div></div>
  <div class="flex gap-2 mb-4"><button onclick="setMode('candle')" id="btn-c" class="flex-1 py-2 rounded-xl text-xs font-semibold bg-navy text-white">Candles</button><button onclick="setMode('line')" id="btn-l" class="flex-1 py-2 rounded-xl text-xs font-semibold bg-line text-soft">Line</button></div>
  <div class="card p-5 text-center"><p id="tmr" class="text-3xl font-extrabold text-navy mb-2">1:30</p><div class="w-full bg-line rounded-full h-2 mb-3"><div id="bar" class="bg-emerald h-2 rounded-full" style="width:100%"></div></div><p class="text-sm text-soft" id="timer-msg">Keep screen open</p><p class="text-xs text-emerald mt-1" id="reward-label">${money(reward)} after approval</p></div>`;
  drawChart();
}
function setMode(m){chartMode=m;drawChart();document.getElementById('btn-c').className=`flex-1 py-2 rounded-xl text-xs font-semibold ${m==='candle'?'bg-navy text-white':'bg-line text-soft'}`;document.getElementById('btn-l').className=`flex-1 py-2 rounded-xl text-xs font-semibold ${m==='line'?'bg-navy text-white':'bg-line text-soft'}`;}
function drawChart(){const c=document.getElementById('chart-canvas');if(!c)return;
if(chartMode==='candle'){let h='';for(let i=0;i<28;i++){const body=14+Math.random()*48,wt=6+Math.random()*16,wb=6+Math.random()*16,up=Math.random()>0.42;h+=`<div class="candle ${up?'up':'down'}" style="height:${body}px"><div class="wick" style="top:-${wt}px;height:${wt+body+wb}px"></div></div>`;}c.innerHTML=h;c.className='h-40 flex items-end justify-center';}
else{let pts=[],p=97400;for(let i=0;i<48;i++){p+=(Math.random()-0.47)*200;pts.push(p);}const mn=Math.min(...pts),mx=Math.max(...pts),rg=mx-mn||1;const path=pts.map((v,i)=>{const x=(i/(pts.length-1))*100,y=100-((v-mn)/rg)*82-10;return(i===0?'M':'L')+x.toFixed(1)+','+y.toFixed(1);}).join(' ');c.innerHTML=`<svg viewBox="0 0 100 100" class="w-full h-full" preserveAspectRatio="none"><path d="${path}" stroke="#26a69a" stroke-width="1.6" fill="none"/></svg>`;c.className='h-40';}
const pe=document.getElementById('price'),ce=document.getElementById('chg');if(pe)pe.textContent='$'+(96800+Math.random()*1200).toFixed(0);if(ce){const p=((Math.random()*2.5)-0.6).toFixed(2);ce.textContent=(p>=0?'+':'')+p+'%';ce.className='text-xs '+(p>=0?'text-emerald':'text-danger');}}
function startTimer(){const total=TASK_SEC;timer=setInterval(()=>{left--;const t=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');const el=document.getElementById('tmr'),mini=document.getElementById('tmr-mini'),bar=document.getElementById('bar');if(el)el.textContent=t;if(mini)mini.textContent=t;if(bar)bar.style.width=((left/total)*100)+'%';if(left%2===0)drawChart();if(left<=0){clearInterval(timer);timer=null;onTimerEnd();}},1000);}
async function onTimerEnd(){if(rewardClaimed)return;rewardClaimed=true;try{const data=await api('/api/checkin',{method:'POST',body:JSON.stringify({userId:currentUser.id})});currentUser=data.user;saveSess(currentUser);const msg=document.getElementById('timer-msg'),label=document.getElementById('reward-label'),tmr=document.getElementById('tmr');if(msg)msg.textContent='Submitted for admin approval';if(label)label.textContent=money(reward)+' pending';if(tmr)tmr.textContent='Done';toast('Submitted for approval','info');}catch(e){toast(e.message,'error');}}
function cancelCheckin(){if(timer){clearInterval(timer);timer=null;}go('tasks');}

async function withdraw(){
  await refreshUser();const u=currentUser;let list=[];try{const d=await api('/api/withdrawals/'+u.id);list=d.withdrawals||[];}catch(e){}
  if(u.vipLevel===0){document.getElementById('page-withdraw').innerHTML=`<div class="card p-10 text-center"><h3 class="font-semibold mb-2">Locked</h3><button onclick="go('vip')" class="btn px-6 py-3 rounded-xl text-sm">Plans</button></div>`;return;}
  document.getElementById('page-withdraw').innerHTML=`<div class="mb-5"><h1 class="text-xl font-bold text-navy">Withdraw</h1></div>
  <div class="card p-5 mb-4 bg-ivory"><p class="text-xs text-soft">Available</p><p class="text-2xl font-extrabold">${money(u.balance)}</p></div>
  <div class="card p-5 mb-5"><form id="wd-form" class="space-y-4">
  <select id="wd-provider" class="w-full px-4 py-3 rounded-xl border border-line bg-ivory" required><option value="">Provider</option><option>PalmPay</option><option>OPay</option><option>Moniepoint</option><option>Kuda</option></select>
  <input type="text" id="wd-account" maxlength="10" placeholder="Account number" class="w-full px-4 py-3 rounded-xl border border-line bg-ivory" required/>
  <input type="text" id="wd-name" placeholder="Account name" class="w-full px-4 py-3 rounded-xl border border-line bg-ivory" required/>
  <input type="number" id="wd-amount" min="10" placeholder="Amount" class="w-full px-4 py-3 rounded-xl border border-line bg-ivory" required/>
  <button type="submit" class="btn w-full py-3.5 rounded-xl font-semibold text-sm">Request</button></form></div>
  <div class="card p-5">${list.length===0?'<p class="text-center text-soft text-sm py-4">No withdrawals</p>':list.map(w=>`<div class="flex justify-between py-3 border-b border-line last:border-0"><div><p class="text-sm font-medium">${money(w.amount)} → ${w.provider}</p><p class="text-xs text-soft">${fdate(w.date)}</p></div><span class="text-xs px-2 py-1 rounded-full status-${w.status}">${w.status}</span></div>`).join('')}</div>`;
  document.getElementById('wd-form').onsubmit=async e=>{e.preventDefault();
    const provider=document.getElementById('wd-provider').value,account=document.getElementById('wd-account').value.trim(),name=document.getElementById('wd-name').value.trim(),amount=parseFloat(document.getElementById('wd-amount').value);
    if(!provider||!account||!name||isNaN(amount)||amount<10){toast('Check fields','error');return;}
    if(amount>u.balance){toast('Insufficient','error');return;}
    if(!confirm('Withdraw '+money(amount)+'?'))return;
    try{const data=await api('/api/withdraw',{method:'POST',body:JSON.stringify({userId:u.id,amount,provider,account,name})});currentUser=data.user;saveSess(currentUser);toast('Submitted');withdraw();}catch(err){toast(err.message,'error');}
  };
}

async function history(){
  const u=currentUser;let txs=[],wds=[];
  try{const d=await api('/api/transactions/'+u.id);txs=d.transactions||[];}catch(e){}
  try{const d=await api('/api/withdrawals/'+u.id);wds=d.withdrawals||[];}catch(e){}
  const rewards=txs.filter(t=>['task_reward','welcome_bonus','referral_bonus'].includes(t.type));
  document.getElementById('page-history').innerHTML=`<div class="mb-5"><h1 class="text-xl font-bold text-navy">History</h1></div>
  <div class="flex gap-2 mb-4"><button onclick="showHist('r')" id="tab-r" class="flex-1 py-2.5 rounded-xl text-sm font-semibold bg-navy text-white">Rewards</button><button onclick="showHist('w')" id="tab-w" class="flex-1 py-2.5 rounded-xl text-sm font-semibold bg-line text-soft">Withdrawals</button></div>
  <div id="hist-r" class="card p-5">${rewards.length===0?'<p class="text-center text-soft py-8 text-sm">None</p>':rewards.map(t=>`<div class="flex justify-between py-3 border-b border-line last:border-0"><div><p class="text-sm capitalize">${t.type.replace(/_/g,' ')}</p><p class="text-xs text-soft">${fdate(t.date)}</p></div><p class="text-sm font-semibold text-emerald">+${money(t.amount)}</p></div>`).join('')}</div>
  <div id="hist-w" class="card p-5 hidden">${wds.length===0?'<p class="text-center text-soft py-8 text-sm">None</p>':wds.map(w=>`<div class="flex justify-between py-3 border-b border-line last:border-0"><div><p class="text-sm">${money(w.amount)} → ${w.provider}</p><p class="text-xs text-soft">${fdate(w.date)}</p></div><span class="text-xs status-${w.status} px-2 py-1 rounded-full">${w.status}</span></div>`).join('')}</div>`;
}
function showHist(t){document.getElementById('hist-r').classList.toggle('hidden',t!=='r');document.getElementById('hist-w').classList.toggle('hidden',t!=='w');document.getElementById('tab-r').className=`flex-1 py-2.5 rounded-xl text-sm font-semibold ${t==='r'?'bg-navy text-white':'bg-line text-soft'}`;document.getElementById('tab-w').className=`flex-1 py-2.5 rounded-xl text-sm font-semibold ${t==='w'?'bg-navy text-white':'bg-line text-soft'}`;}

async function referrals(){
  const u=currentUser;let refs=[];try{const d=await api('/api/referrals/'+u.id);refs=d.referrals||[];}catch(e){}
  const link=location.origin+'/?ref='+u.referralCode;
  const earned=refs.filter(r=>r.credited).reduce((s,r)=>s+(r.reward||0),0);
  document.getElementById('page-referrals').innerHTML=`<div class="mb-5"><h1 class="text-xl font-bold text-navy">Referrals</h1><p class="text-sm text-soft">${money(REF_REWARD)} per successful VIP referral</p></div>
  <div class="card p-5 mb-4 text-center"><p class="text-xs text-soft">Your Code</p><p class="text-2xl font-extrabold tracking-wider">${u.referralCode}</p>
  <button onclick="navigator.clipboard.writeText('${u.referralCode}').then(()=>toast('Copied'))" class="text-sm text-navy mt-2">Copy</button></div>
  <div class="card p-5 mb-4"><div class="flex gap-2"><input readonly value="${link}" id="rlink" class="flex-1 px-3 py-2 rounded-lg border text-xs bg-ivory"/><button onclick="navigator.clipboard.writeText(document.getElementById('rlink').value).then(()=>toast('Copied'))" class="btn px-4 py-2 rounded-lg text-sm">Copy</button></div></div>
  <div class="grid grid-cols-2 gap-3 mb-4"><div class="card p-4 text-center"><p class="text-xl font-extrabold">${refs.length}</p><p class="text-xs text-soft">Referred</p></div><div class="card p-4 text-center"><p class="text-xl font-extrabold text-emerald">${money(earned)}</p><p class="text-xs text-soft">Earned</p></div></div>
  <div class="card p-5">${refs.length===0?'<p class="text-center text-soft py-6 text-sm">No referrals yet</p>':refs.map(r=>`<div class="flex justify-between py-3 border-b border-line last:border-0"><div><p class="text-sm font-medium">${r.referredName||'User'}</p><p class="text-xs text-soft">${r.referredPhone||''}</p></div><span class="text-xs ${r.credited?'text-emerald':'text-soft'}">${r.credited?'Paid '+money(r.reward):r.status||'Registered'}</span></div>`).join('')}</div>`;
}

function profile(){
  const u=currentUser;
  document.getElementById('page-profile').innerHTML=`<div class="mb-5"><h1 class="text-xl font-bold text-navy">Profile</h1></div>
  <div class="card p-6 mb-4 text-center"><div class="w-16 h-16 mx-auto rounded-full bg-navy text-white flex items-center justify-center text-2xl font-bold mb-3">${u.name[0]}</div>
  <h2 class="font-semibold text-lg">${u.name}</h2><p class="text-soft text-sm">${u.phone}</p></div>
  <div class="card p-5 mb-4 space-y-3 text-sm"><div class="flex justify-between"><span class="text-soft">Balance</span><span class="font-semibold">${money(u.balance)}</span></div>
  <div class="flex justify-between"><span class="text-soft">Code</span><span class="font-semibold">${u.referralCode}</span></div></div>
  <div class="card p-5 mb-3"><button onclick="go('history')" class="w-full text-left text-sm font-medium">History →</button></div>
  <div class="card p-5 mb-3"><button onclick="go('withdraw')" class="w-full text-left text-sm font-medium">Withdraw →</button></div>
  <div class="card p-5 mb-4"><a href="https://wa.me/${WHATSAPP}" class="text-navy font-medium text-sm">Support · 0816 231 4640</a></div>
  <button onclick="logout()" class="w-full py-3.5 rounded-xl border border-danger text-danger font-semibold text-sm">Sign Out</button>`;
}

async function toggleNotif(){const panel=document.getElementById('notif-panel');panel.classList.toggle('hidden');if(!panel.classList.contains('hidden')){try{const d=await api('/api/announcements');const anns=d.announcements||[];document.getElementById('notif-list').innerHTML=anns.length===0?'<p class="text-soft text-sm text-center py-4">None</p>':anns.map(a=>`<div class="py-2 border-b border-line last:border-0"><p class="text-sm">${a.text}</p><p class="text-xs text-soft">${fdate(a.date)}</p></div>`).join('');}catch(e){}}}

(async function init(){const s=getSess();if(s&&s.userId){try{const d=await api('/api/user/'+s.userId);currentUser=d.user;saveSess(currentUser);enter();return;}catch(e){clearSess();}}document.getElementById('auth').classList.remove('hidden');
const params=new URLSearchParams(location.search);if(params.get('ref')){const el=document.getElementById('reg-ref');if(el)el.value=params.get('ref');}})();
</script>
